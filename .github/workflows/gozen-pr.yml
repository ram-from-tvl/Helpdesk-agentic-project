name: GoZen PR Checks

on:
  pull_request:
    branches: ["**"]

jobs:
  gozen-pr:
    runs-on: ubuntu-latest
    env:
      LYZR_API_KEY: ${{ secrets.LYZR_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate quality fixtures
        run: python apps/helpdesk_ops_assistant/scripts/generate_gozen_fixtures.py

      - name: Run PR Quality Gate (L1-L3)
        run: python scripts/run_pr_quality_gate.py

      - name: Build Dashboard Snapshot
        run: python operations/dashboard/build_dashboard.py

      - name: Upload PR Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gozen-pr-dashboard
          path: |
            artifacts/pr_quality_report.json
            artifacts/dashboard.html
