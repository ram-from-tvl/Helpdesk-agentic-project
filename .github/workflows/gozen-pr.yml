name: GoZen PR Checks

on:
  pull_request:
    branches: ["**"]

jobs:
  gozen-pr:
    runs-on: ubuntu-latest
    env:
      LYZR_API_KEY: ${{ secrets.LYZR_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate demo fixtures
        run: python demo_projects/langgraph_groq_helpdesk/scripts/generate_gozen_fixtures.py

      - name: L1 Component Checks
        run: python gozen_cli.py --level 1 --test-file test_cases/demo_langgraph_level1_components.json --module demo_projects.langgraph_groq_helpdesk.app.components

      - name: Optional Discovery Showcase
        run: python gozen_cli.py --init demo_projects/langgraph_groq_helpdesk/app/components.py

      - name: L2 Trajectory Checks
        run: python gozen_cli.py --level 2 --test-file test_cases/demo_langgraph_level2_trajectories.json

      - name: L3 Outcome Checks
        run: python gozen_cli.py --level 3 --test-file test_cases/demo_langgraph_level3_outcomes.json
