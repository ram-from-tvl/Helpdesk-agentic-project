<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoZen Local Control Center</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --ink: #1d2636;
      --muted: #5f6b7a;
      --line: #dbe3ef;
      --card: #ffffff;
      --brand: #0f5bd8;
      --brand2: #0b8f6e;
      --warn: #bb4d00;
      --danger: #c62828;
      --ok: #188038;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% -20%, #deebff 0, transparent 45%),
        radial-gradient(circle at 90% 0, #def8ef 0, transparent 42%),
        var(--bg);
    }
    .layout {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 14px 20px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(16, 32, 62, 0.06);
      overflow: hidden;
    }
    .header {
      padding: 16px;
      color: #fff;
      background: linear-gradient(115deg, var(--brand), #2458ff 55%, var(--brand2));
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 6px 0 0; font-size: 13px; opacity: 0.95; }
    .section { padding: 14px 16px; border-top: 1px solid var(--line); }
    .section h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .actions { display: grid; gap: 8px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.09); }
    .btn-brand { color: #fff; background: linear-gradient(120deg, var(--brand), #3f75ff); }
    .btn-green { color: #fff; background: linear-gradient(120deg, #0f8f5d, #1ea569); }
    .btn-gray { color: #1f2937; background: #edf2fb; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      background: #f8fbff;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 12px;
      color: #334155;
    }

    .content {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
      min-height: calc(100vh - 40px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.04);
    }
    .metric h4 { margin: 0; font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
    .metric .v { margin-top: 8px; font-size: 28px; font-weight: 700; }
    .ok { color: var(--ok); }
    .bad { color: var(--danger); }
    .warn { color: var(--warn); }

    .editor {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 420px;
    }
    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }
    .tab {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .tab.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(120deg, var(--brand), #3f75ff);
    }

    #jsonArea {
      width: 100%;
      height: 100%;
      min-height: 300px;
      border: 0;
      resize: none;
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.45;
      padding: 14px;
      background: #f7faff;
      color: #10233f;
    }

    .editor-actions {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .logs {
      background: #0f172a;
      color: #d2e2ff;
      border-radius: 12px;
      border: 1px solid #1f3258;
      padding: 12px;
      min-height: 140px;
      white-space: pre-wrap;
      overflow: auto;
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 12px;
    }

    .foot {
      font-size: 12px;
      color: var(--muted);
      padding: 4px 2px;
    }

    @media (max-width: 1020px) {
      .layout { grid-template-columns: 1fr; }
      .content { min-height: auto; }
      .cards { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <div class="header">
        <h1>GoZen Local Portal</h1>
        <p>Dataset control + evaluation run center on localhost</p>
      </div>

      <div class="section">
        <h3>Quick Run</h3>
        <div class="actions">
          <button class="btn-brand" onclick="runTarget('all')">Run Full Pipeline</button>
          <button class="btn-green" onclick="runTarget('pr')">Run PR Quality (L1-L3)</button>
          <button class="btn-green" onclick="runTarget('prod')">Run Production Monitor (L4)</button>
          <button class="btn-gray" onclick="runTarget('fixtures')">Regenerate Fixtures</button>
          <button class="btn-gray" onclick="runTarget('dashboard')">Rebuild Dashboard</button>
        </div>
      </div>

      <div class="section">
        <h3>Dataset Files</h3>
        <div id="datasetInfo" class="chips"></div>
      </div>

      <div class="section">
        <h3>Links</h3>
        <div class="actions">
          <button class="btn-gray" onclick="openDashboard()">Open Static Dashboard (artifacts)</button>
          <button class="btn-gray" onclick="refreshAll()">Refresh Summary</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <section class="cards" id="cards"></section>

      <section class="editor">
        <div class="tabs">
          <button class="tab active" data-key="l1" onclick="switchDataset('l1', this)">L1 Components</button>
          <button class="tab" data-key="l2" onclick="switchDataset('l2', this)">L2 Trajectories</button>
          <button class="tab" data-key="l3" onclick="switchDataset('l3', this)">L3 Outcomes</button>
          <button class="tab" data-key="l4" onclick="switchDataset('l4', this)">L4 Monitoring</button>
        </div>
        <textarea id="jsonArea" spellcheck="false"></textarea>
        <div class="editor-actions">
          <button class="btn-brand" onclick="validateJson()">Validate JSON</button>
          <button class="btn-green" onclick="saveDataset()">Save Dataset</button>
          <button class="btn-gray" onclick="reloadDataset()">Reload Current</button>
        </div>
      </section>

      <section class="logs" id="logs">Ready. Use Run buttons or edit datasets and save.</section>

      <div class="foot">Local service only. Start with: uvicorn operations.local_portal:app --reload --port 8080</div>
    </main>
  </div>

  <script>
    let activeDataset = 'l1';

    function log(msg) {
      const box = document.getElementById('logs');
      box.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n` + box.textContent;
    }

    function statusClass(v) {
      if (v === 'PASS') return 'ok';
      if (v === 'FAIL') return 'bad';
      return 'warn';
    }

    async function refreshSummary() {
      const res = await fetch('/api/summary');
      const summary = await res.json();

      const pr = summary.pr || {};
      const prod = summary.prod || {};

      const cards = [
        { title: 'L1', score: pr.L1 ? pr.L1.score : 0, status: pr.L1 ? pr.L1.status : 'N/A' },
        { title: 'L2', score: pr.L2 ? pr.L2.score : 0, status: pr.L2 ? pr.L2.status : 'N/A' },
        { title: 'L3', score: pr.L3 ? pr.L3.score : 0, status: pr.L3 ? pr.L3.status : 'N/A' },
        { title: 'L4', score: prod.L4 ? prod.L4.score : 0, status: prod.L4 ? prod.L4.status : 'N/A' },
      ];

      document.getElementById('cards').innerHTML = cards.map(c => `
        <article class="metric">
          <h4>${c.title}</h4>
          <div class="v">${c.score}%</div>
          <div class="${statusClass(c.status)}"><strong>${c.status}</strong></div>
        </article>
      `).join('');

      return summary;
    }

    async function refreshDatasetInfo() {
      const res = await fetch('/api/datasets');
      const info = await res.json();
      const html = Object.entries(info).map(([k, v]) =>
        `<span class="chip">${k.toUpperCase()}: ${v.records} records</span>`
      ).join('');
      document.getElementById('datasetInfo').innerHTML = html;
    }

    async function loadDataset(key) {
      const res = await fetch(`/api/datasets/${key}`);
      const payload = await res.json();
      document.getElementById('jsonArea').value = JSON.stringify(payload.data, null, 2);
      log(`Loaded ${key.toUpperCase()} dataset from ${payload.path}`);
    }

    async function switchDataset(key, btn) {
      activeDataset = key;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      await loadDataset(key);
    }

    function validateJson() {
      const raw = document.getElementById('jsonArea').value;
      try {
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) {
          throw new Error('Top-level JSON must be an array of objects.');
        }
        log(`Validation passed for ${activeDataset.toUpperCase()} (${data.length} records).`);
      } catch (e) {
        log(`Validation failed: ${e.message}`);
      }
    }

    async function saveDataset() {
      const raw = document.getElementById('jsonArea').value;
      let data;
      try {
        data = JSON.parse(raw);
        if (!Array.isArray(data)) {
          throw new Error('Top-level JSON must be an array.');
        }
      } catch (e) {
        log(`Save blocked: ${e.message}`);
        return;
      }

      const res = await fetch(`/api/datasets/${activeDataset}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data }),
      });
      const payload = await res.json();
      if (!res.ok) {
        log(`Save failed: ${payload.detail || 'Unknown error'}`);
        return;
      }

      log(`Saved ${activeDataset.toUpperCase()} (${payload.records} records) -> ${payload.saved_to}`);
      await refreshDatasetInfo();
    }

    async function reloadDataset() {
      await loadDataset(activeDataset);
    }

    async function runTarget(key) {
      log(`Running ${key}...`);
      const res = await fetch(`/api/run/${key}`, { method: 'POST' });
      const payload = await res.json();
      if (payload.ok) {
        log(`${key} completed successfully.`);
      } else {
        log(`${key} failed with code ${payload.returncode}.`);
      }

      if (payload.stdout) {
        log(`STDOUT:\n${payload.stdout}`);
      }
      if (payload.stderr) {
        log(`STDERR:\n${payload.stderr}`);
      }

      await refreshAll();
    }

    function openDashboard() {
      window.open('/artifacts/dashboard.html', '_blank');
    }

    async function refreshAll() {
      await refreshSummary();
      await refreshDatasetInfo();
    }

    (async function init() {
      await refreshAll();
      await loadDataset('l1');
    })();
  </script>
</body>
</html>
